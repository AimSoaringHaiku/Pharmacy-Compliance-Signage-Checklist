theme: default
allowLocalFiles: true
options:
  html: true
  markdown:
    style: |
      /* 🌟 1. 通常スライド表示時のデザイン */
      section {
        background-color: #f7f7f7 !important;
        color: #2b2b2b !important;
        font-family: "Yu Gothic", "Meiryo", sans-serif !important;
      }
      h1 { color: #1e3a8a !important; }   /* 見出し：ネイビー */
      h2 { color: #0f172a; }   /* 小見出し：ダークスレート */

      /* 🌟 2. 頑固な黒い裏画面システム（すべてのモード）を上から強制破壊するCSS */
      :root, body, #preview, .bespoke-marp-parent, [data-bespoke-view="overview"], body[data-bespoke-view="overview"] {
        background: #f0f2f5 !important; /* 黒背景を強制的にライトグレーへ変更 */
      }
      
      /* スライドの並びを「横4枚」から「横3枚」に力技で固定し、間隔を狭める */
      .bespoke-marp-parent, [data-bespoke-view="overview"] .bespoke-marp-parent, body[data-bespoke-view="overview"] .bespoke-marp-parent {
        display: grid !important;
        grid-template-columns: repeat(3, minmax(0, 1fr)) !important;
        gap: 15px !important;
        padding: 20px !important;
        max-width: 1200px !important;
        margin: 0 auto !important;
      }

      /* スライドの周りに美しい白い影の枠線をつけ、大きさを整える */
      section, .bespoke-marp-slide, [data-bespoke-view="overview"] section {
        box-shadow: 0 4px 10px rgba(0,0,0,0.08) !important;
        border-radius: 8px !important;
        border: 1px solid #e2e8f0 !important;
      }
