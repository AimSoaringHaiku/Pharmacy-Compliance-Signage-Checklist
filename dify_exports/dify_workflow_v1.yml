            \       ]\n        },\n        {\n          \"target_kasan\": \"連携強化加算\"\
            ,\n          \"required_postings\": [\n            {\n              \"\
            name\": \"災害や新興感染症発生時における対応可能な体制\",\n              \"locations\": { \"\
            inside\": false, \"outside\": false, \"web\": true },\n              \"\
            notes\": \"ウェブサイトで広く周知（行政や薬剤師会のページ等へのリンクのみは不可）\"\n              \"warning\"\
            : \"【重要】未掲載のまま算定すると要件不備となり、個別指導等で自主返還（返金）リスクが生じます。速やかな是正を推奨します。\" \n \
