            : [\n            {\n              \"name\": \"開局時間\",\n              \"\
            locations\": { \"inside\": true, \"outside\": true, \"web\": false }\n\
            \            },\n            {\n              \"name\": \"対象となる日及び受付時間\"\
            ,\n              \"locations\": { \"inside\": true, \"outside\": false,\
            \ \"web\": false }\n            }\n          ]\n        },\n        {\n\
            \          \"target_kasan\": \"居宅療養管理指導\",\n          \"required_postings\"\
            : [\n            {\n              \"name\": \"運営規程、サービス事業者等の重要事項\",\n\
            \              \"locations\": { \"inside\": true, \"outside\": false,\
            \ \"web\": true },\n              \"notes\": \"原則としてウェブサイトに掲載\"\n    \
            \        }\n          ]\n        },\n        {\n          \"target_kasan\"\
            : \"電子的調剤情報連携体制整備加算\",\n          \"required_postings\": [\n         \
            \   {\n              \"name\": \"医療DX推進の体制・情報活用に関する事項\",\n           \
            \   \"locations\": { \"inside\": true, \"outside\": false, \"web\": true\
