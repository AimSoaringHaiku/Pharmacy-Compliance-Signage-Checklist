            : true, \"outside\": true, \"web\": false }\n            },\n        \
            \    {\n              \"name\": \"近隣及び自局に直接連絡が取れる連絡先電話番号等\",\n       \
            \       \"locations\": { \"inside\": false, \"outside\": true, \"web\"\
            : false }\n            }\n          ]\n        },\n        {\n       \
