            \        },\n        {\n          \"name\": \"調剤報酬点数表\",\n          \"\
            locations\": { \"inside\": true, \"outside\": false, \"web\": true },\n\
            \          \"notes\": \"原則ウェブサイトにも掲載（経過措置ありの場合あり）\"\n        },\n    \
            \    {\n          \"name\": \"個人情報保護方針\",\n          \"locations\": {\
            \ \"inside\": true, \"outside\": false, \"web\": false }\n        },\n\
            \        {\n          \"name\": \"薬剤師不在時間\",\n          \"locations\"\
            : { \"inside\": true, \"outside\": true, \"web\": false },\n         \
            \ \"condition\": \"不在になる場合のみ\"\n        }\n      ]\n    },\n    \"additional_requirements\"\
